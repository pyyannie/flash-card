<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>单词闪卡学习</title>

<!-- Add-to-home-screen support: run full screen with no Safari chrome -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="单词闪卡">
<meta name="theme-color" content="#2a1b52">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ---------- design tokens ---------- */
:root {
  --bg-top: #2a1b52;
  --bg-bottom: #1d1238;
  --card1-a: #4a5bc0; --card1-b: #5a54c4;
  --card2-a: #8f5fc6; --card2-b: #a370d2;
  --card3-a: #9585d8; --card3-b: #a08fdd;
  --card4-a: #8a7ad2; --card4-b: #9184d6;
  --pill-bg: #3d2f6b;
  --badge: #e8455c;
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.68);
  --panel: #33245e;
  --panel-2: #3d2c6e;
  --stroke: rgba(255, 255, 255, 0.14);
  --ok: #4ec98a;
  --warn: #ffb347;
  --radius: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; min-height: 100%;
}

/* The gradient lives on html so it covers the safe areas too.
   iOS Safari mishandles background-attachment:fixed, hence this split. */
html {
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  background-repeat: no-repeat;
  background-color: var(--bg-bottom);
}

body {
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Phone-width column, centred on desktop.
   The safe-area insets keep content clear of the notch and the home bar
   when running full screen from the home screen. */
.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;   /* dvh excludes the Safari toolbars, avoiding a cut-off */
  padding: calc(22px + env(safe-area-inset-top)) 16px
           calc(110px + env(safe-area-inset-bottom));
  position: relative;
}

/* No keyboard on a phone — hide the shortcut hint on touch devices */
@media (hover: none) and (pointer: coarse) {
  .kbd-hint { display: none; }
}

button { font-family: inherit; cursor: pointer; border: none; }

/* ---------- shared header ---------- */
.page-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.back-btn {
  background: rgba(255,255,255,0.12);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 14px;
}
.back-btn:hover { background: rgba(255,255,255,0.2); }
.page-head .spacer { flex: 1; }

/* ---------- home ---------- */
.home-hero { text-align: center; padding: 12px 0 22px; }
.home-hero .glyph { font-size: 42px; line-height: 1; }
.home-hero h1 { margin: 12px 0 6px; font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
.home-hero p { margin: 0; font-size: 13px; color: var(--text-dim); }

.tiles { display: flex; flex-direction: column; gap: 12px; }

.tile {
  border-radius: var(--radius);
  padding: 26px 18px;
  text-align: center;
  color: #fff;
  display: block;
  width: 100%;
  transition: transform 0.12s ease, filter 0.12s ease;
}
.tile:hover { filter: brightness(1.08); }
.tile:active { transform: scale(0.985); }
.tile .glyph { font-size: 26px; line-height: 1; }
.tile .title { font-size: 17px; font-weight: 600; margin-top: 10px; }
.tile .sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 6px; }

.tile-1 { background: linear-gradient(180deg, var(--card1-a), var(--card1-b)); }
.tile-2 { background: linear-gradient(180deg, var(--card2-a), var(--card2-b)); }
.tile-3 { background: linear-gradient(180deg, var(--card3-a), var(--card3-b)); }
.tile-4 { background: linear-gradient(180deg, var(--card4-a), var(--card4-b)); }

/* ---------- floating favourites pill ---------- */
.pill {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(26px + env(safe-area-inset-bottom));
  background: var(--pill-bg);
  color: #fff;
  border-radius: 999px;
  padding: 12px 22px;
  font-size: 14px;
  display: flex; align-items: center; gap: 9px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.38);
  z-index: 40;
}
.pill:hover { filter: brightness(1.15); }
.badge {
  background: var(--badge);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
  font-weight: 700;
}

/* ---------- generic panel / section ---------- */
.section-title { font-size: 20px; font-weight: 700; margin: 4px 0 4px; }
.section-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }

.seg {
  display: flex; gap: 8px; margin-bottom: 14px;
}
.seg button {
  flex: 1;
  background: rgba(255,255,255,0.10);
  color: var(--text-dim);
  border-radius: 12px;
  padding: 11px;
  font-size: 14px;
}
.seg button.on { background: rgba(255,255,255,0.26); color: #fff; font-weight: 600; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tool-btn {
  background: rgba(255,255,255,0.12);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13px;
}
.tool-btn:hover { background: rgba(255,255,255,0.2); }
.tool-btn.danger { background: rgba(232,69,92,0.22); color: #ffb8c2; }

textarea.word-input {
  width: 100%;
  min-height: 170px;
  background: rgba(0,0,0,0.24);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  color: #fff;
  padding: 14px;
  font-size: 14px;
  line-height: 1.65;
  resize: vertical;
  font-family: inherit;
}
textarea.word-input::placeholder { color: rgba(255,255,255,0.42); }

.submit-btn {
  width: 100%;
  margin-top: 14px;
  background: linear-gradient(90deg, var(--card2-a), var(--card1-a));
  color: #fff;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: 600;
}
.submit-btn:hover { filter: brightness(1.1); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.notice {
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 12px;
  display: flex; gap: 8px; align-items: flex-start;
}
.notice.err { background: rgba(232,69,92,0.18); color: #ffc3cc; }
.notice.info { background: rgba(78,201,138,0.16); color: #b6f0d2; }
.notice .x { margin-left: auto; cursor: pointer; opacity: 0.7; }

.hint {
  font-size: 12px; color: var(--text-dim); line-height: 1.7;
  background: rgba(0,0,0,0.18);
  border-radius: 12px; padding: 12px 14px; margin-top: 14px;
}
.hint code {
  background: rgba(255,255,255,0.12); padding: 1px 5px; border-radius: 4px;
  font-size: 11.5px;
}

/* ---------- flashcard ---------- */
.fc-counter { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }

.flip-wrap { perspective: 1200px; margin-bottom: 18px; }
.flip {
  position: relative;
  width: 100%;
  height: 320px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  cursor: pointer;
}
.flip.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 22px;
  padding: 26px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  overflow: auto;
}
.face.front { background: linear-gradient(160deg, var(--card2-a), var(--card1-b)); }
.face.back  { background: linear-gradient(160deg, var(--card1-a), var(--card3-b)); transform: rotateY(180deg); }

.face .word { font-size: 34px; font-weight: 700; word-break: break-word; }
.face .phon { font-size: 15px; color: rgba(255,255,255,0.8); margin-top: 10px; }
.face .pos {
  font-size: 12px; background: rgba(0,0,0,0.24);
  padding: 3px 10px; border-radius: 999px; margin-bottom: 10px;
}
.face .mean { font-size: 21px; font-weight: 600; line-height: 1.5; word-break: break-word; }
.face .eg {
  font-size: 13px; color: rgba(255,255,255,0.82);
  margin-top: 16px; line-height: 1.7; font-style: italic;
}
.face .tap { position: absolute; bottom: 14px; font-size: 11.5px; color: rgba(255,255,255,0.5); }

.fc-actions { display: flex; gap: 10px; }
.fc-actions button {
  flex: 1;
  background: rgba(255,255,255,0.12);
  color: #fff;
  border-radius: 13px;
  padding: 13px 6px;
  font-size: 14px;
}
.fc-actions button:hover { background: rgba(255,255,255,0.2); }
.fc-actions button:disabled { opacity: 0.35; cursor: not-allowed; }
.fc-actions button.faved { background: rgba(255,179,71,0.28); color: #ffd9a0; }

/* ---------- autoplay bar ---------- */
.auto-bar {
  display: flex; gap: 8px; margin-top: 10px;
}
.auto-bar .play {
  flex: 1.6;
  background: rgba(255,255,255,0.12);
  color: #fff; border-radius: 13px; padding: 13px 6px;
  font-size: 14px; font-weight: 600;
}
.auto-bar .play.on {
  background: linear-gradient(90deg, var(--card2-a), var(--card1-a));
}
.auto-bar .play:hover { filter: brightness(1.12); }
.auto-bar .sound {
  flex: 1;
  background: rgba(255,255,255,0.12);
  color: var(--text-dim); border-radius: 13px; padding: 13px 6px; font-size: 14px;
}
.auto-bar .sound.on { background: rgba(78,201,138,0.24); color: #b6f0d2; }

.speed-seg { display: flex; gap: 8px; margin-top: 8px; }
.speed-seg button {
  flex: 1;
  background: rgba(255,255,255,0.10);
  color: var(--text-dim);
  border-radius: 11px; padding: 10px 4px; font-size: 13px;
}
.speed-seg button.on { background: rgba(255,255,255,0.26); color: #fff; font-weight: 600; }

.fc-tip {
  text-align: center; font-size: 12.5px; color: var(--warn);
  margin-top: 10px; min-height: 18px;
}

/* ---------- manage list ---------- */
.mlist { display: flex; flex-direction: column; gap: 9px; }
.mrow {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--stroke);
  border-radius: 13px;
  padding: 13px 14px;
  display: flex; align-items: center; gap: 12px;
}
.mrow .info { flex: 1; min-width: 0; }
.mrow .w { font-size: 16px; font-weight: 600; }
.mrow .m { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .acts { display: flex; gap: 5px; flex-shrink: 0; }
.icon-btn {
  background: rgba(255,255,255,0.12);
  color: #fff; border-radius: 9px;
  width: 34px; height: 34px; font-size: 15px;
  display: grid; place-items: center;
}
.icon-btn:hover { background: rgba(255,255,255,0.22); }
.icon-btn.del:hover { background: rgba(232,69,92,0.4); }
.icon-btn.faved { background: rgba(255,179,71,0.3); color: #ffd9a0; }

/* Four buttons per row get tight on a phone */
@media (max-width: 420px) {
  .mrow { padding: 12px 10px; }
  .mrow .acts { gap: 4px; }
  .icon-btn { width: 30px; height: 30px; font-size: 14px; border-radius: 8px; }
}

.empty {
  text-align: center; color: var(--text-dim);
  padding: 60px 20px; font-size: 14px; line-height: 1.8;
}
.empty .glyph { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.6; }

/* ---------- modal ---------- */
.mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: grid; place-items: center;
  padding: 20px; z-index: 60;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 20px;
  width: 100%; max-width: 400px;
  max-height: 84vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal header {
  display: flex; align-items: center;
  padding: 16px 18px;
  border-bottom: 1px solid var(--stroke);
}
.modal header h3 { margin: 0; font-size: 17px; flex: 1; }
.modal .body { padding: 16px 18px; overflow: auto; }
.modal .body p { margin: 0 0 12px; font-size: 14px; line-height: 1.7; color: var(--text-dim); }
.modal footer {
  display: flex; gap: 10px; padding: 14px 18px;
  border-top: 1px solid var(--stroke);
}
.modal footer button {
  flex: 1; border-radius: 12px; padding: 12px; font-size: 14.5px;
  background: rgba(255,255,255,0.12); color: #fff;
}
.modal footer button.primary { background: var(--card2-a); font-weight: 600; }
.modal footer button.danger { background: var(--badge); font-weight: 600; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
.field input, .field textarea {
  width: 100%;
  background: rgba(0,0,0,0.26);
  border: 1px solid var(--stroke);
  border-radius: 10px;
  color: #fff; padding: 10px 12px; font-size: 14px;
  font-family: inherit;
}
.field textarea { min-height: 64px; resize: vertical; }

.fav-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.fav-row:last-child { border-bottom: none; }
.fav-row .w { font-weight: 600; font-size: 15px; }
.fav-row .m { font-size: 12.5px; color: var(--text-dim); }

/* ---------- sync chip ---------- */
.sync-bar { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 4px; }
.ver { font-size: 10.5px; color: rgba(255,255,255,0.3); }
.sync-chip {
  background: rgba(255,255,255,0.10);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 12.5px;
  display: flex; align-items: center; gap: 6px;
}
.sync-chip:hover { background: rgba(255,255,255,0.18); }
.sync-chip.ok    { background: rgba(78,201,138,0.18); color: #b6f0d2; }
.sync-chip.err   { background: rgba(232,69,92,0.20); color: #ffc3cc; }
.sync-chip.busy  { background: rgba(255,179,71,0.20); color: #ffd9a0; }

.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.token-help {
  font-size: 12px; color: var(--text-dim); line-height: 1.8;
  background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px 14px; margin-top: 10px;
}
.token-help ol { margin: 6px 0 0; padding-left: 20px; }
.token-help a { color: #b9a6ff; }

.danger-zone { display: flex; gap: 8px; margin-top: 12px; }
.danger-zone button {
  flex: 1; font-size: 12.5px; padding: 10px 6px; border-radius: 10px;
  background: rgba(255,255,255,0.10); color: var(--text-dim);
}
.danger-zone button:hover { background: rgba(255,255,255,0.18); color: #fff; }

/* ---------- voice picker ---------- */
.vgroup { margin-bottom: 16px; }
.vgroup h4 { font-size: 13px; margin: 0 0 8px; color: rgba(255,255,255,.75); font-weight: 600; }
.vrow { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.vpick {
  flex: 1; text-align: left; background: rgba(255,255,255,0.08);
  color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.vpick:hover { background: rgba(255,255,255,0.16); }
.vrow.on .vpick { background: rgba(143,95,198,0.4); font-weight: 600; }
.vname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vlang { font-size: 11px; color: rgba(255,255,255,.45); flex-shrink: 0; }
.male { font-size: 10.5px; color: #8fd0ff; }

.hidden { display: none !important; }
</style>
</head>

<div class="app" id="app"></div>
<input type="file" id="file-picker" accept=".csv,.txt,.tsv,.numbers,.xlsx,.xls,text/csv,text/plain" class="hidden">

<script>
'use strict';

const APP_VERSION = '10';

/* =========================================================
   Storage layer — replaces window.lingguang.db (cloud SQL)
   with the browser's own localStorage. Same record shape as
   the original word_cards table.
   ========================================================= */
const CARDS_KEY = 'flashcard_cards';
const FAVORITES_KEY = 'flashcard_favorites';
const TOMBS_KEY = 'flashcard_deleted';

/* Deletion records ("tombstones"): word → when it was deleted.
   Without these, merge-sync pulled a just-deleted card straight back from
   the cloud a few seconds later, so deleting appeared to do nothing. */
function loadTombs() {
  try {
    const raw = localStorage.getItem(TOMBS_KEY);
    const o = raw ? JSON.parse(raw) : {};
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) {
    return {};
  }
}

function saveTombs(t) {
  localStorage.setItem(TOMBS_KEY, JSON.stringify(t));
}

// Forget records older than this so the list cannot grow forever
const TOMB_TTL = 60 * 24 * 3600 * 1000;   // 60 days

function pruneTombs(t) {
  const cutoff = Date.now() - TOMB_TTL;
  const out = {};
  Object.keys(t || {}).forEach(function (k) {
    if (t[k] > cutoff) out[k] = t[k];
  });
  return out;
}

function loadCards() {
  try {
    const raw = localStorage.getItem(CARDS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}
function saveCards(cards) {
  localStorage.setItem(CARDS_KEY, JSON.stringify(cards));
  scheduleSync();
}
function loadFavorites() {
  try {
    const raw = localStorage.getItem(FAVORITES_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}
function saveFavorites(favs) {
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs));
  scheduleSync();
}

function newId() {
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

/* =========================================================
   App state
   ========================================================= */
const state = {
  view: 'home',           // home | input | flashcard | manage
  cards: loadCards(),
  favorites: loadFavorites(),
  deck: [],               // cards currently being studied
  index: 0,
  flipped: false,
  inputText: '',
  error: '',
  info: '',
  modal: null,            // {type, payload}
  manageSort: localStorage.getItem('flashcard_manage_sort') || 'order',  // order | az
  autoPlay: false,
  speakMode: localStorage.getItem('flashcard_speak_mode') || 'en',  // off | en | both
  speed: localStorage.getItem('flashcard_speed') || 'mid',   // slow | mid | fast
  round: 1,
  tip: '',
  syncToken: localStorage.getItem('flashcard_sync_token') || '',
  syncGist: localStorage.getItem('flashcard_sync_gist') || '',
  lastSync: Number(localStorage.getItem('flashcard_sync_time') || 0),
  syncStatus: localStorage.getItem('flashcard_sync_token') ? 'idle' : 'off',
  syncMsg: '',
};

/* =========================================================
   Autoplay — steps through the deck on a timer:
   front (speak) → hold → flip to back → hold → next card.
   Uses chained setTimeout rather than setInterval so a step
   can never stack up behind a slow render.
   ========================================================= */
const SPEEDS = { slow: 5000, mid: 3000, fast: 1500 };
const SPEED_LABEL = { slow: '慢', mid: '中', fast: '快' };
const SPEAK_LABEL = { off: '🔇 不读', en: '🔊 英文', both: '🔊 英+中' };
let autoTimer = null;
let gapTimer = null;   // pause between the Chinese meaning and the next word

// Stopping playback: kill both timers.
function clearAuto() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; }
}

// Queueing the next step: only reset the step timer. Clearing gapTimer here
// would cancel the pause that the step we just ran had scheduled.
function scheduleAuto() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (!state.autoPlay || state.view !== 'flashcard' || state.modal) return;
  autoTimer = setTimeout(autoStep, SPEEDS[state.speed] || SPEEDS.mid);
}

function autoSpeak(word) {
  if (state.speakMode !== 'off') speak(word, 'en-US');
}

function autoStep() {
  if (!state.autoPlay || state.view !== 'flashcard' || state.modal) return;

  if (!state.flipped) {
    setState({ flipped: true });          // front → back
    if (state.speakMode === 'both') speakMeaning(state.deck[state.index]);
  } else if (state.index < state.deck.length - 1) {
    const next = state.index + 1;
    setState({ index: next, flipped: false });
    speakAfterGap(next);
  } else {
    // End of deck: loop back to the start instead of stopping.
    const round = state.round + 1;
    setState({ index: 0, flipped: false, round: round, tip: '第 ' + round + ' 轮' });
    speakAfterGap(0);
  }
  scheduleAuto();
}

/* Leave a beat before the next English word. Without it the Chinese
   meaning runs straight into it and the two blur together. */
function speakAfterGap(idx) {
  const gap = state.speakMode === 'both' ? 550 : 120;
  if (gapTimer) clearTimeout(gapTimer);
  gapTimer = setTimeout(function () {
    gapTimer = null;
    if (state.autoPlay && state.view === 'flashcard' &&
        state.index === idx && !state.flipped) {
      autoSpeak(state.deck[idx].word);
    }
  }, gap);
}

function startAuto() {
  if (state.deck.length === 0) return;
  state.autoPlay = true;
  state.tip = '';
  autoSpeak(state.deck[state.index].word);
  render();
  scheduleAuto();
}

// Pause: freeze on the current card so play resumes from here.
function pauseAuto(tip) {
  clearAuto();
  { const s = tts(); if (s) s.cancel(); }
  setState({ autoPlay: false, tip: tip || '' });
}

// Stop: halt and rewind to the first card.
function stopAuto() {
  clearAuto();
  { const s = tts(); if (s) s.cancel(); }
  setState({ autoPlay: false, index: 0, flipped: false, round: 1, tip: '' });
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

/* =========================================================
   Card creation + dedup
   ========================================================= */

// Split free text into candidate words. Mirrors the original:
// separated by spaces, commas or newlines.
function extractWords(text) {
  return text
    .split(/[\s,，、;；\n\r\t]+/)
    .map(function (w) { return w.trim(); })
    .filter(function (w) { return w.length > 0; });
}

function addCards(entries) {
  // entries: [{word, meaning, phonetic, partOfSpeech, example, favorite}]
  const existing = new Set(state.cards.map(function (c) { return c.word.toLowerCase(); }));
  const fresh = [];
  const seenInBatch = new Set();
  const wantFav = [];
  let dupes = 0;

  entries.forEach(function (e) {
    const word = (e.word || '').trim();
    if (!word) return;
    const key = word.toLowerCase();

    // Restore the bookmark even for words that already have a card
    if (isTruthyFlag(e.favorite)) wantFav.push(word);

    if (existing.has(key) || seenInBatch.has(key)) { dupes++; return; }
    seenInBatch.add(key);
    fresh.push({
      id: newId(),
      word: word,
      phonetic: (e.phonetic || '').trim(),
      meaning: (e.meaning || '').trim(),
      partOfSpeech: (e.partOfSpeech || '').trim(),
      example: (e.example || '').trim(),
      sortOrder: 0,
      createdAt: Date.now(),
    });
  });

  // Adding a word back cancels its deletion record. The new card must also
  // be stamped strictly later than the tombstone, or a delete and re-add in
  // the same millisecond would be indistinguishable.
  if (fresh.length) {
    const tombs = loadTombs();
    let changed = false;
    fresh.forEach(function (c) {
      const k = c.word.toLowerCase();
      if (tombs[k]) {
        c.createdAt = Math.max(c.createdAt, tombs[k] + 1);
        delete tombs[k];
        changed = true;
      }
    });
    if (changed) saveTombs(tombs);
  }

  const merged = state.cards.concat(fresh);
  merged.forEach(function (c, i) { c.sortOrder = i; });
  saveCards(merged);

  let favorites = state.favorites;
  if (wantFav.length) {
    favorites = favorites.slice();
    wantFav.forEach(function (w) {
      const dup = favorites.some(function (x) { return x.toLowerCase() === w.toLowerCase(); });
      if (!dup) favorites.push(w);
    });
    saveFavorites(favorites);
  }

  return { added: fresh.length, dupes: dupes, cards: merged, favorites: favorites };
}

/* =========================================================
   CSV / TSV parsing
   Handles quoted fields. Header row is auto-detected when it
   contains a "word" column.
   ========================================================= */
/* Pick the delimiter. Tab wins only when it splits every line into the same
   number of columns — that is what a spreadsheet copy looks like. Checking
   "has tab AND no comma" was wrong: one comma inside a Chinese meaning made
   a Numbers paste fall back to comma and mangle the whole row. */
function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(function (l) { return l.trim() !== ''; }).slice(0, 30);
  if (!lines.length) return ',';
  const cols = lines.map(function (l) { return l.split('\t').length; });
  const uniform = cols.every(function (n) { return n === cols[0]; });
  return (cols[0] > 1 && uniform) ? '\t' : ',';
}

function parseDelimited(text) {
  // Strip the UTF-8 BOM. Excel and our own CSV export both write one,
  // and leaving it in corrupts the first header cell.
  text = text.replace(/^﻿/, '');

  const delim = detectDelimiter(text);
  const rows = [];
  let field = '';
  let row = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === delim) {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else if (ch === '\r') {
      // skip; \n handles the break
    } else {
      field += ch;
    }
  }
  row.push(field);
  if (row.length > 1 || row[0].trim() !== '') rows.push(row);

  return rows.filter(function (r) {
    return r.some(function (c) { return c.trim() !== ''; });
  });
}

/* ---- Column sniffing, used when a file has no usable header row ----
   Guessing "column 2 is the meaning" put phonetics into the meaning field.
   Instead, look at what each column actually contains. */

const IPA_CHARS = /[ˈˌːəɪʊæɒɔʌθðʃʒŋɡɜɐ]/;
const HAN = /[一-鿿]/;

function looksPhonetic(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s || HAN.test(s)) return false;
  if (/^[/[].*[/\]]$/.test(s)) return true;     // /miːd/ or [miːd]
  return IPA_CHARS.test(s);
}

function looksPartOfSpeech(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s || s.length > 14) return false;
  if (/^(n|v|adj|adv|prep|conj|pron|num|art|int|vt|vi|aux|abbr)([.．/、]|$)/i.test(s)) return true;
  return /^(名词|动词|形容词|副词|介词|连词|代词|数词|冠词|感叹词|短语|词组|专有名词|固定短语|名词短语|动词短语)/.test(s);
}

function looksChinese(v) { return HAN.test(String(v == null ? '' : v)); }

function looksWord(v) {
  const s = String(v == null ? '' : v).trim();
  return !!s && /[A-Za-z]/.test(s) && !looksPhonetic(s);
}

/* Assign roles to columns by majority vote over the sample rows. */
function sniffColumns(rows) {
  const width = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
  const sample = rows.slice(0, 40);
  const nonEmpty = function (i) {
    return sample.filter(function (r) { return String(r[i] || '').trim() !== ''; }).length;
  };
  const share = function (i, fn) {
    const n = nonEmpty(i);
    if (!n) return 0;
    return sample.filter(function (r) { return fn(r[i]); }).length / n;
  };

  const stats = [];
  for (let i = 0; i < width; i++) {
    stats.push({
      i: i,
      filled: nonEmpty(i),
      numeric: share(i, function (v) { return /^\d+$/.test(String(v || '').trim()); }),
      phon: share(i, looksPhonetic),
      pos: share(i, looksPartOfSpeech),
      han: share(i, looksChinese),
      word: share(i, looksWord),
    });
  }

  const taken = {};
  const claim = function (key, cands) {
    for (const c of cands) {
      if (taken[c.i]) continue;
      taken[c.i] = key;
      return c.i;
    }
    return -1;
  };
  const best = function (field, min) {
    return stats.filter(function (s) { return s.filled && s[field] >= min && !taken[s.i]; })
                .sort(function (a, b) { return b[field] - a[field]; });
  };

  // Row numbers first, so they never get mistaken for anything else
  stats.filter(function (s) { return s.numeric >= 0.9 && s.filled; })
       .forEach(function (s) { taken[s.i] = 'skip'; });

  const map = {};
  map.word = claim('word', best('word', 0.5));
  map.phonetic = claim('phonetic', best('phon', 0.5));
  map.partOfSpeech = claim('partOfSpeech', best('pos', 0.5));
  map.meaning = claim('meaning', best('han', 0.5));
  // Anything left with Chinese in it is the example sentence
  map.example = claim('example', best('han', 0.3));

  if (map.word < 0) {
    // No obviously English column — fall back to the first unclaimed one
    const first = stats.find(function (s) { return s.filled && !taken[s.i]; });
    if (first) { map.word = first.i; taken[first.i] = 'word'; }
  }
  return map;
}

/* Header matching.

   Exact names are checked first, then substring rules, so "中文释义",
   "释义(中文)", "英文单词" and "Meaning" all resolve correctly without
   the user having to memorise an exact spelling.

   Order matters: the first rule whose pattern appears in the header
   cell wins, and each field is claimed only once. */
const HEADER_EXACT = {
  word: 'word', meaning: 'meaning', phonetic: 'phonetic',
  partofspeech: 'partOfSpeech', pos: 'partOfSpeech', example: 'example',
  favorite: 'favorite', fav: 'favorite',
  // Columns we deliberately ignore
  序号: null, 编号: null, no: null, id: null, index: null, 'n': null,
};

const HEADER_RULES = [
  // favorite goes first: the header 「生词本」 contains 「生词」, which would
  // otherwise be claimed by the word rule below.
  { key: 'favorite',     pats: ['收藏', '生词本', '星标', 'favorite', 'favourite', 'starred', 'bookmark'] },
  { key: 'word',         pats: ['单词', '词汇', '生词', 'word', 'vocab', 'term'] },
  { key: 'phonetic',     pats: ['音标', '发音', 'phonetic', 'pronunciation', 'ipa'] },
  { key: 'partOfSpeech', pats: ['词性', 'partofspeech', 'speech'] },
  { key: 'example',      pats: ['例句', '造句', 'example', 'sentence'] },
  { key: 'meaning',      pats: ['释义', '意思', '解释', '翻译', '含义', '中文',
                                'meaning', 'definition', 'translation', 'chinese'] },
];

// Values that mean "yes, this word is bookmarked"
function isTruthyFlag(v) {
  const s = String(v == null ? '' : v).trim().toLowerCase();
  return s === '是' || s === '有' || s === 'y' || s === 'yes' ||
         s === '1' || s === 'true' || s === '✓' || s === '√';
}

function normHeader(h) {
  return String(h || '').trim().toLowerCase().replace(/[\s_()（）:：.-]/g, '');
}

function matchHeader(cell, taken) {
  const h = normHeader(cell);
  if (!h) return null;

  if (Object.prototype.hasOwnProperty.call(HEADER_EXACT, h)) {
    const k = HEADER_EXACT[h];
    return k && !taken.has(k) ? k : null;
  }

  for (let i = 0; i < HEADER_RULES.length; i++) {
    const rule = HEADER_RULES[i];
    if (taken.has(rule.key)) continue;
    for (let j = 0; j < rule.pats.length; j++) {
      if (h.indexOf(rule.pats[j]) !== -1) return rule.key;
    }
  }
  return null;
}

function rowsToEntries(rows) {
  if (rows.length === 0) return [];

  const taken = new Set();
  const mapped = rows[0].map(function (cell) {
    const key = matchHeader(cell, taken);
    if (key) taken.add(key);
    return key;
  });

  if (taken.has('word')) {
    return rows.slice(1).map(function (r) {
      const obj = {};
      mapped.forEach(function (key, i) {
        if (key) obj[key] = (r[i] || '').trim();
      });
      return obj;
    }).filter(function (o) { return o.word; });
  }

  // No recognisable header: work out what each column holds by looking at
  // the content, rather than assuming col0=word / col1=meaning.
  const map = sniffColumns(rows);
  const get = function (r, idx) { return idx >= 0 ? (r[idx] || '').trim() : ''; };

  return rows.map(function (r) {
    return {
      word: get(r, map.word),
      phonetic: get(r, map.phonetic),
      partOfSpeech: get(r, map.partOfSpeech),
      meaning: get(r, map.meaning),
      example: get(r, map.example),
    };
  }).filter(function (o) { return o.word; });
}

/* =========================================================
   Pronunciation — the browser's built-in speech synthesis.

   iOS needs three accommodations that desktop Safari does not:
   1. the engine only starts from inside a user gesture, so we prime it
      with a silent utterance on the first tap;
   2. cancel() immediately followed by speak() drops the new utterance,
      so we only cancel when something is queued and then defer;
   3. a bare lang tag can be silent — pick a real voice when one exists.
   ========================================================= */
/* Returns the speech engine only when it is genuinely usable.
   `'speechSynthesis' in window` is not enough: the key can exist with a
   null value, and dereferencing that crashes the whole script. */
function tts() {
  const s = typeof window !== 'undefined' ? window.speechSynthesis : null;
  return (s && typeof s.speak === 'function') ? s : null;
}

let speechPrimed = false;

function primeSpeech() {
  const s = tts();
  if (speechPrimed || !s) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    s.speak(u);
    speechPrimed = true;
  } catch (e) { /* nothing we can do */ }
}

const VOICE_EN_KEY = 'flashcard_voice_en';
const VOICE_ZH_KEY = 'flashcard_voice_zh';

function allVoices() {
  const s = tts();
  return (s && s.getVoices && s.getVoices()) || [];
}

function voicesByLang(prefix) {
  return allVoices().filter(function (v) {
    return (v.lang || '').toLowerCase().replace('_', '-').indexOf(prefix) === 0;
  });
}

/* Resolve which voice to speak with: the user's pick if it is still
   installed, otherwise the closest match for the language. */
function pickVoice(lang) {
  const want = String(lang || '').toLowerCase();
  const zh = want.indexOf('zh') === 0;
  const saved = localStorage.getItem(zh ? VOICE_ZH_KEY : VOICE_EN_KEY);
  const all = allVoices();

  if (saved) {
    const hit = all.find(function (v) { return v.name === saved; });
    if (hit) return hit;
  }
  const base = want.slice(0, 2);
  return all.find(function (v) {
    return (v.lang || '').toLowerCase().replace('_', '-') === want;
  }) || all.find(function (v) {
    return (v.lang || '').toLowerCase().replace('_', '-').indexOf(base) === 0;
  }) || null;
}

function voicesFor(lang) {
  const want = String(lang || '').toLowerCase();
  const base = want.slice(0, 2);
  const all = allVoices();
  return {
    all: all,
    exact: all.find(function (v) {
      return (v.lang || '').toLowerCase().replace('_', '-') === want;
    }),
    loose: all.find(function (v) {
      return (v.lang || '').toLowerCase().replace('_', '-').indexOf(base) === 0;
    }),
  };
}

function speak(text, lang) {
  const s = tts();
  if (!s || !text) return;
  const target = lang || 'en-US';

  const start = function () {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = target;
    const v = pickVoice(target);
    if (v) u.voice = v;
    u.rate = target === 'zh-CN' ? 1 : 0.9;
    u.volume = 1;
    s.speak(u);
  };

  if (s.speaking || s.pending) {
    s.cancel();
    setTimeout(start, 60);
  } else {
    start();
  }
}

// Read the back of a card: the meaning, in Chinese.
function speakMeaning(card) {
  if (!card || !card.meaning) return;
  const v = voicesFor('zh-CN');
  // Only warn once we actually know the voice list (it is empty on first call)
  if (v.all.length && !v.exact && !v.loose) {
    setState({ tip: '这台设备没装中文语音，中文读不出来' });
    return;
  }
  speak(card.meaning, 'zh-CN');
}

/* =========================================================
   Small helpers
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function favoriteCards() {
  const set = new Set(state.favorites.map(function (w) { return w.toLowerCase(); }));
  return state.cards.filter(function (c) { return set.has(c.word.toLowerCase()); });
}

function isFav(word) {
  return state.favorites.some(function (w) { return w.toLowerCase() === word.toLowerCase(); });
}

/* =========================================================
   Navigation
   ========================================================= */
function goHome() {
  clearAuto();
  { const s = tts(); if (s) s.cancel(); }
  setState({ view: 'home', error: '', info: '', tip: '', autoPlay: false, round: 1, modal: null });
}

function enterFlashcards(which) {
  clearAuto();
  const deck = which === 'fav' ? favoriteCards() : state.cards.slice();
  if (deck.length === 0) {
    setState({
      modal: {
        type: 'alert',
        title: which === 'fav' ? '生词本是空的' : '还没有卡片',
        text: which === 'fav'
          ? '先在闪卡页面点「收藏」，把要重点复习的单词加进生词本。'
          : '先去「制作卡片」加一些单词吧。',
      },
    });
    return;
  }
  setState({ view: 'flashcard', deck: deck, index: 0, flipped: false, tip: '', autoPlay: false, round: 1, modal: null });
}

/* =========================================================
   Actions
   ========================================================= */
function handleTextSubmit() {
  const text = state.inputText.trim();
  if (!text) {
    setState({ error: '请先输入内容', info: '' });
    return;
  }

  let entries;
  // A line containing a comma or tab is treated as structured data
  if (/[,\t]/.test(text) && text.indexOf('\n') !== -1) {
    entries = rowsToEntries(parseDelimited(text));
  } else {
    entries = extractWords(text).map(function (w) { return { word: w }; });
  }

  if (entries.length === 0) {
    setState({ error: '没有识别到可用的单词', info: '' });
    return;
  }

  const r = addCards(entries);
  let msg = '成功加入 ' + r.added + ' 个单词';
  if (r.dupes > 0) msg += '，跳过 ' + r.dupes + ' 个重复的';
  setState({ cards: r.cards, favorites: r.favorites, inputText: '', error: '', info: msg });
}

// Which import the file picker is serving: 'cards' or 'favorites'
let importTarget = 'cards';

function handleFileImport(target) {
  importTarget = target || 'cards';
  document.getElementById('file-picker').click();
}

function onFileChosen(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  if (/\.numbers$/.test(name)) {
    setState({
      error: 'Numbers 文件是苹果的专用格式，网页读不了。两个办法：' +
             '① 在 Numbers 里全选表格（含表头那一行）→ 复制 → 粘到下面输入框，最省事；' +
             '② 或者「文件 → 导出为 → CSV」，再导入那个 .csv。',
      info: '',
    });
    return;
  }
  if (/\.(xlsx|xls)$/.test(name)) {
    setState({
      error: 'Excel 文件读不了。请在 Excel 里选「文件 → 另存为 → CSV UTF-8」，再导入那个 .csv 文件。' +
             '或者直接全选表格复制，粘到下面输入框。',
      info: '',
    });
    return;
  }
  if (/\.(pages|key|doc|docx|pdf|rtf)$/.test(name)) {
    setState({ error: '这个文件类型读不了。请改用 CSV，或者直接把表格内容复制粘贴到输入框。', info: '' });
    return;
  }

  const reader = new FileReader();
  reader.onload = function () {
    const text = String(reader.result || '');

    if (importTarget === 'favorites') {
      importFavorites(text, file.name);
      return;
    }

    let entries;
    if (/\.(csv|tsv)$/.test(name) || /[,\t]/.test(text)) {
      entries = rowsToEntries(parseDelimited(text));
    } else {
      entries = extractWords(text).map(function (w) { return { word: w }; });
    }
    if (entries.length === 0) {
      setState({ error: '这个文件里没读到单词', info: '' });
      return;
    }
    const r = addCards(entries);
    let msg = '从「' + file.name + '」导入 ' + r.added + ' 个单词';
    if (r.dupes > 0) msg += '，跳过 ' + r.dupes + ' 个重复的';
    setState({ cards: r.cards, favorites: r.favorites, error: '', info: msg });
  };
  reader.onerror = function () {
    // A folder can be picked when its name ends in .csv — Numbers exports
    // exactly that. FileReader then fails with no useful detail, so spell
    // out the likely cause instead of just saying "failed".
    setState({
      error: /\.(csv|tsv|txt)$/.test(name)
        ? '读不出内容 —— 你选中的很可能是一个「文件夹」，不是文件。' +
          'Numbers 导出 CSV 时会生成一个同名的文件夹，请双击它进去，选里面那个 .csv 文件。' +
          '（在选择器里看右侧预览，写「文件夹」就是它）'
        : '文件读取失败，这个文件可能损坏或者格式不支持。可以试试直接把表格内容复制粘贴到输入框。',
      info: '',
    });
  };
  reader.readAsText(file, 'utf-8');
}

async function handlePaste() {
  try {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      setState({ error: '这个浏览器不支持自动粘贴，请点进输入框按 ⌘V', info: '' });
      return;
    }
    const t = await navigator.clipboard.readText();
    if (!t) {
      setState({ error: '剪贴板是空的', info: '' });
      return;
    }
    setState({ inputText: (state.inputText ? state.inputText + '\n' : '') + t, error: '', info: '' });
  } catch (e) {
    setState({ error: '粘贴失败，请点进输入框按 ⌘V', info: '' });
  }
}

/* Export to CSV. scope 'fav' writes only the favourites.
   The 收藏 column lets a re-import restore which words were bookmarked —
   without it a backup loses the whole favourites list. */
function exportCsv(scope) {
  const onlyFav = scope === 'fav';
  const list = onlyFav ? favoriteCards() : state.cards;

  if (list.length === 0) {
    setState({ error: onlyFav ? '生词本还是空的，没有可导出的内容' : '还没有卡片可以导出', info: '' });
    return;
  }

  const q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  const lines = ['单词,音标,中文释义,词性,例句,收藏'];
  list.forEach(function (c) {
    lines.push([c.word, c.phonetic, c.meaning, c.partOfSpeech, c.example,
                isFav(c.word) ? '是' : ''].map(q).join(','));
  });

  // BOM so Excel opens the Chinese text correctly
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = onlyFav ? '生词本.csv' : '单词卡片.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  setState({ error: '', info: '已导出 ' + list.length + ' 个单词到「下载」文件夹', modal: null });
}

/* =========================================================
   Sync via a private GitHub Gist.

   The token lives only in this browser's localStorage — it is never
   part of the source, so publishing this page stays safe. Only the
   `gist` scope is needed.

   Strategy: merge. Cards are keyed by lower-cased word, so nothing is
   ever lost; empty fields get filled in from whichever side has them.
   Deletions therefore do not propagate — that is what the two force
   buttons are for.
   ========================================================= */
const SYNC_TOKEN_KEY = 'flashcard_sync_token';
const SYNC_GIST_KEY  = 'flashcard_sync_gist';
const SYNC_TIME_KEY  = 'flashcard_sync_time';
const GIST_FILE = 'flashcard-data.json';
const GIST_DESC = 'Flash Card data (managed by the app)';

let syncTimer = null;
let syncSuppressed = false;   // guards against sync writing → triggering sync
let syncInFlight = false;     // must not live on state: callers set state first

function ghHeaders() {
  return {
    'Authorization': 'Bearer ' + state.syncToken,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
}

async function ghApi(path, options) {
  const res = await fetch('https://api.github.com' + path,
    Object.assign({ headers: ghHeaders() }, options || {}));
  if (res.status === 401) throw new Error('令牌无效或已过期，请重新填写');
  if (res.status === 403) throw new Error('GitHub 拒绝了请求（可能是频率限制），过一会再试');
  if (!res.ok) throw new Error('GitHub 返回 ' + res.status);
  return res.json();
}

// Locate the gist holding our data file, or create it on first use.
async function findOrCreateGist() {
  if (state.syncGist) return state.syncGist;

  const list = await ghApi('/gists?per_page=100');
  const hit = list.find(function (g) { return g.files && g.files[GIST_FILE]; });
  if (hit) {
    state.syncGist = hit.id;
    localStorage.setItem(SYNC_GIST_KEY, hit.id);
    return hit.id;
  }

  const files = {};
  files[GIST_FILE] = { content: JSON.stringify(emptyPayload(), null, 2) };
  const made = await ghApi('/gists', {
    method: 'POST',
    body: JSON.stringify({ description: GIST_DESC, public: false, files: files }),
  });
  state.syncGist = made.id;
  localStorage.setItem(SYNC_GIST_KEY, made.id);
  return made.id;
}

function emptyPayload() {
  return { version: 1, updatedAt: Date.now(), cards: [], favorites: [], deleted: {} };
}

function localPayload() {
  return {
    version: 1,
    updatedAt: Date.now(),
    cards: state.cards,
    favorites: state.favorites,
    deleted: pruneTombs(loadTombs()),
  };
}

async function readRemote() {
  const id = await findOrCreateGist();
  const g = await ghApi('/gists/' + id);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return emptyPayload();
  // Large gists come back truncated with a raw_url to fetch instead
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  try {
    const d = JSON.parse(text);
    return {
      version: d.version || 1,
      updatedAt: d.updatedAt || 0,
      cards: Array.isArray(d.cards) ? d.cards : [],
      favorites: Array.isArray(d.favorites) ? d.favorites : [],
      deleted: (d.deleted && typeof d.deleted === 'object') ? d.deleted : {},
    };
  } catch (e) {
    return emptyPayload();
  }
}

async function writeRemote(payload) {
  const id = await findOrCreateGist();
  const files = {};
  files[GIST_FILE] = { content: JSON.stringify(payload, null, 2) };
  await ghApi('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: files }) });
}

/* Merge two sides. New cards from either side are kept and blank fields are
   filled in. A card is dropped only when a deletion record is newer than the
   other side's copy — that is how a delete travels between devices. */
function mergeData(local, remote) {
  const tombs = pruneTombs(
    Object.assign({}, remote.deleted || {}, loadTombs())
  );
  // When both sides recorded a deletion, keep the later timestamp
  Object.keys(remote.deleted || {}).forEach(function (k) {
    const mine = loadTombs()[k] || 0;
    const theirs = remote.deleted[k];
    if (theirs > (tombs[k] || 0) && theirs > mine) tombs[k] = theirs;
  });

  const byWord = new Map();

  const take = function (c, side) {
    const key = (c.word || '').trim().toLowerCase();
    if (!key) return;

    // Deleted, and the deletion is newer than this copy → stay deleted
    const tomb = tombs[key];
    if (tomb) {
      const stamp = side === 'remote' ? (remote.updatedAt || 0) : (c.createdAt || 0);
      if (tomb >= stamp) return;
    }

    const prev = byWord.get(key);
    if (!prev) {
      byWord.set(key, Object.assign({}, c));
      return;
    }
    ['phonetic', 'meaning', 'partOfSpeech', 'example'].forEach(function (f) {
      if (!prev[f] && c[f]) prev[f] = c[f];
    });
    if (!prev.createdAt || (c.createdAt && c.createdAt < prev.createdAt)) {
      prev.createdAt = c.createdAt;
    }
  };

  (remote.cards || []).forEach(function (c) { take(c, 'remote'); });
  (local.cards || []).forEach(function (c) { take(c, 'local'); });

  const cards = Array.from(byWord.values());
  cards.forEach(function (c, i) {
    if (!c.id) c.id = newId();
    c.sortOrder = i;
  });

  const alive = new Set(cards.map(function (c) { return c.word.toLowerCase(); }));
  const seen = new Set();
  const favorites = [];
  (remote.favorites || []).concat(local.favorites || []).forEach(function (w) {
    const k = String(w).toLowerCase();
    if (!alive.has(k)) return;              // never resurrect a deleted word
    if (!seen.has(k)) { seen.add(k); favorites.push(w); }
  });

  // Whatever survived is alive: drop its tombstone so neither side can
  // resurrect the deletion on a later sync.
  alive.forEach(function (k) { delete tombs[k]; });

  saveTombs(tombs);
  return { version: 1, updatedAt: Date.now(), cards: cards, favorites: favorites, deleted: tombs };
}

function applyPayload(p) {
  syncSuppressed = true;
  saveCards(p.cards);
  saveFavorites(p.favorites);
  syncSuppressed = false;
  state.cards = p.cards;
  state.favorites = p.favorites;
}

function markSynced() {
  const t = Date.now();
  localStorage.setItem(SYNC_TIME_KEY, String(t));
  state.lastSync = t;
}

function syncTimeLabel() {
  if (!state.lastSync) return '还没同步过';
  const diff = Date.now() - state.lastSync;
  if (diff < 60000) return '刚刚同步';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前同步';
  const d = new Date(state.lastSync);
  const p = function (n) { return n < 10 ? '0' + n : String(n); };
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' 同步';
}

/* mode: 'merge' | 'up' (local wins) | 'down' (cloud wins) */
async function syncNow(mode) {
  if (!state.syncToken) return;
  if (syncInFlight) return;

  syncInFlight = true;
  setState({ syncStatus: 'syncing', syncMsg: '' });
  try {
    if (mode === 'up') {
      const mine = localPayload();
      await writeRemote(mine);
      markSynced();
      setState({ syncStatus: 'ok', syncMsg: '已用本地覆盖云端（' + mine.cards.length + ' 张）' });
      return;
    }

    const remote = await readRemote();

    if (mode === 'down') {
      applyPayload(remote);
      markSynced();
      setState({
        syncStatus: 'ok', cards: remote.cards, favorites: remote.favorites,
        syncMsg: '已用云端覆盖本地（' + remote.cards.length + ' 张）',
      });
      return;
    }

    const before = state.cards.length;
    const merged = mergeData(localPayload(), remote);
    applyPayload(merged);
    await writeRemote(merged);
    markSynced();

    const gained = merged.cards.length - before;
    setState({
      syncStatus: 'ok', cards: merged.cards, favorites: merged.favorites,
      syncMsg: gained > 0 ? '同步完成，新增 ' + gained + ' 张' : '同步完成，共 ' + merged.cards.length + ' 张',
    });
  } catch (e) {
    setState({ syncStatus: 'error', syncMsg: e.message || '同步失败' });
  } finally {
    // Must always clear: the branches above return early, and without this
    // one failure would wedge sync permanently.
    syncInFlight = false;
  }
}

// Debounced auto-push after any local write
function scheduleSync() {
  if (!state.syncToken || syncSuppressed) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { syncNow('merge'); }, 4000);
}

function connectSync(token) {
  const t = (token || '').trim();
  if (!t) return;
  localStorage.setItem(SYNC_TOKEN_KEY, t);
  state.syncToken = t;
  state.syncGist = '';
  localStorage.setItem(SYNC_GIST_KEY, '');
  state.syncMsg = '正在连接…';
  syncNow('merge');
}

function disconnectSync() {
  localStorage.setItem(SYNC_TOKEN_KEY, '');
  localStorage.setItem(SYNC_GIST_KEY, '');
  localStorage.setItem(SYNC_TIME_KEY, '');
  clearTimeout(syncTimer);
  setState({ syncToken: '', syncGist: '', lastSync: 0, syncStatus: 'off', syncMsg: '', modal: null });
}

/* Import a favourites list: any word in the file gets bookmarked. Words
   without a card yet get one created, so a bare word list works too. */
function importFavorites(text, fileName) {
  let entries;
  if (/[,\t]/.test(text) && text.indexOf('\n') !== -1) {
    entries = rowsToEntries(parseDelimited(text));
  } else {
    entries = extractWords(text).map(function (w) { return { word: w }; });
  }
  if (!entries.length) {
    setState({ error: '这个文件里没读到单词', info: '', modal: null });
    return;
  }

  // Everything in a favourites file counts as favourited
  entries.forEach(function (e) { e.favorite = '是'; });

  const before = state.cards.length;
  const favBefore = state.favorites.length;
  const r = addCards(entries);
  const newCards = r.cards.length - before;
  const newFavs = r.favorites.length - favBefore;

  let msg = '从「' + fileName + '」收藏了 ' + newFavs + ' 个生词';
  if (newCards > 0) msg += '，其中 ' + newCards + ' 个是新建的卡片';
  if (newFavs === 0) msg = '这些词本来就都在生词本里了';

  setState({ cards: r.cards, favorites: r.favorites, error: '', info: msg, modal: null });
}

function toggleFav(word) {
  let favs = state.favorites.slice();
  if (isFav(word)) {
    favs = favs.filter(function (w) { return w.toLowerCase() !== word.toLowerCase(); });
  } else {
    favs.push(word);
  }
  saveFavorites(favs);
  setState({ favorites: favs });
}

function deleteCard(id) {
  const gone = state.cards.find(function (c) { return c.id === id; });
  const cards = state.cards.filter(function (c) { return c.id !== id; });
  cards.forEach(function (c, i) { c.sortOrder = i; });

  // Record the deletion so sync removes it from the cloud too, instead of
  // treating the cloud copy as "something the other side still has".
  if (gone) {
    const tombs = loadTombs();
    tombs[gone.word.toLowerCase()] = Date.now();
    saveTombs(tombs);
  }
  saveCards(cards);

  // Drop the word from the favourites list too, otherwise the badge counts
  // a word that no longer has a card behind it.
  let favs = state.favorites;
  if (gone) {
    const stillThere = cards.some(function (c) {
      return c.word.toLowerCase() === gone.word.toLowerCase();
    });
    if (!stillThere) {
      favs = favs.filter(function (w) { return w.toLowerCase() !== gone.word.toLowerCase(); });
      saveFavorites(favs);
    }
  }

  // Keep the deck in sync if we are mid-study
  const deck = state.deck.filter(function (c) { return c.id !== id; });
  const index = Math.min(state.index, Math.max(0, deck.length - 1));
  setState({ cards: cards, deck: deck, favorites: favs, index: index, modal: null });
}

function clearAll() {
  // Do not auto-sync here: a merge would pull everything straight back from
  // the cloud. Tell the user to use 「强制上传」 if they also want it gone there.
  syncSuppressed = true;
  clearTimeout(syncTimer);
  saveCards([]);
  saveFavorites([]);
  syncSuppressed = false;
  setState({
    cards: [], favorites: [], deck: [], index: 0, modal: null,
    info: state.syncToken
      ? '已清空本地卡片。云端还留着备份 —— 如果也要清掉，去「☁️ 同步」点「强制上传」'
      : '已清空全部卡片',
  });
}

function saveEdit(id) {
  const g = function (n) { return (document.getElementById(n) || {}).value || ''; };
  const word = g('e-word').trim();
  if (!word) return;

  const cards = state.cards.map(function (c) {
    if (c.id !== id) return c;
    return Object.assign({}, c, {
      word: word,
      phonetic: g('e-phon').trim(),
      meaning: g('e-mean').trim(),
      partOfSpeech: g('e-pos').trim(),
      example: g('e-eg').trim(),
    });
  });
  saveCards(cards);
  const deck = state.deck.map(function (d) {
    const hit = cards.find(function (c) { return c.id === d.id; });
    return hit || d;
  });
  setState({ cards: cards, deck: deck, modal: null });
}

function addOneCard() {
  const g = function (n) { return (document.getElementById(n) || {}).value || ''; };
  const word = g('e-word').trim();
  if (!word) return;
  const r = addCards([{
    word: word,
    phonetic: g('e-phon').trim(),
    meaning: g('e-mean').trim(),
    partOfSpeech: g('e-pos').trim(),
    example: g('e-eg').trim(),
  }]);
  setState({
    cards: r.cards,
    favorites: r.favorites,
    modal: null,
    error: r.added === 0 ? '「' + word + '」已经在卡片里了' : '',
    info: r.added > 0 ? '已添加「' + word + '」' : '',
  });
}

/* What the device can actually say. Empty string = nothing worth warning about. */
function voiceWarning() {
  const s = tts();
  if (!s) return '这个浏览器不支持朗读';
  const all = (s.getVoices && s.getVoices()) || [];
  if (!all.length) return '';          // not loaded yet — stay quiet
  const has = function (p) {
    return all.some(function (v) { return (v.lang || '').toLowerCase().indexOf(p) === 0; });
  };
  if (!has('en') && !has('zh')) return '没检测到可用语音，朗读不会出声';
  if (!has('en')) return '没检测到英文语音';
  if (!has('zh') && state.speakMode === 'both') return '没检测到中文语音，中文读不出来';
  return '';
}

/* Move through the deck, wrapping around at both ends so the last card
   leads back to the first and the first steps back to the last. */
function stepCard(delta) {
  const n = state.deck.length;
  if (!n) return;
  const next = ((state.index + delta) % n + n) % n;
  setState({ index: next, flipped: false, tip: '' });
  if (state.autoPlay) scheduleAuto();
}

    <div class="speed-seg">
      ${['off','en','both'].map(function (s) {
        return `<button class="${state.speakMode === s ? 'on' : ''}" data-act="say-${s}">${SPEAK_LABEL[s]}</button>`;
      }).join('')}
      <button data-act="voice-open" title="换朗读声音">🗣</button>
    </div>
    <div class="speed-seg">
      ${['slow','mid','fast'].map(function (s) {
        return `<button class="${state.speed === s ? 'on' : ''}" data-act="speed-${s}">${SPEED_LABEL[s]} ${SPEEDS[s]/1000}秒</button>`;
      }).join('')}
    </div>
    <div class="fc-tip">${esc(state.tip || voiceWarning())}</div>
    <div class="hint kbd-hint">键盘也能用：<code>空格</code> 翻卡，<code>←</code> <code>→</code> 切换，<code>S</code> 发音（正面读英文、背面读中文），<code>F</code> 收藏，<code>P</code> 自动播放</div>
  `;
}

/* Sort order for the manage list only. The study deck keeps import order. */
const SORT_KEY = 'flashcard_manage_sort';

function manageSortedCards() {
  if (state.manageSort !== 'az') return state.cards;
  // localeCompare with sensitivity:'base' makes the sort case-insensitive,
  // so "Verdict" lands next to "vertical" rather than ahead of everything.
  return state.cards.slice().sort(function (a, b) {
    return a.word.localeCompare(b.word, 'en', { sensitivity: 'base' });
  });
}

function viewManage() {
  const rows = manageSortedCards().map(function (c) {
    const faved = isFav(c.word);
    return `
      <div class="mrow">
        <div class="info">
          <div class="w">${esc(c.word)}${c.phonetic ? ` <span style="font-size:12px;opacity:.6">${esc(c.phonetic)}</span>` : ''}</div>
          <div class="m">${c.meaning ? esc(c.meaning) : '（无释义）'}</div>
        </div>
        <div class="acts">
          <button class="icon-btn ${faved ? 'faved' : ''}" data-act="fav-one" data-word="${esc(c.word)}"
                  title="${faved ? '移出生词本' : '加入生词本'}">${faved ? '★' : '☆'}</button>
          <button class="icon-btn" data-act="speak-one" data-word="${esc(c.word)}" title="发音">🔊</button>
          <button class="icon-btn" data-act="edit" data-id="${c.id}" title="编辑">✏️</button>
          <button class="icon-btn del" data-act="ask-del" data-id="${c.id}" title="删除">🗑</button>
        </div>
      </div>`;
  }).join('');

  const seg = state.cards.length > 1 ? `
    <div class="seg" style="margin-bottom:14px">
      <button class="${state.manageSort === 'order' ? 'on' : ''}" data-act="sort-order">导入顺序</button>
      <button class="${state.manageSort === 'az' ? 'on' : ''}" data-act="sort-az">A → Z</button>
    </div>` : '';

  return `
    <div class="page-head">
      <button class="back-btn" data-act="home">← 返回</button>
      <div class="spacer"></div>
      <button class="tool-btn" data-act="add-one">➕ 添加</button>
      <button class="tool-btn" data-act="export">⬇ 导出 CSV</button>
    </div>
    <div class="section-title">卡片管理</div>
    <div class="section-sub">${state.cards.length} 张卡片，可编辑删除</div>
    ${noticeHtml()}
    ${seg}
    ${state.cards.length === 0
      ? '<div class="empty"><span class="glyph">📭</span>还没有卡片<br>去「制作卡片」加几个单词吧</div>'
      : `<div class="mlist">${rows}</div>`}
    ${state.cards.length > 0
      ? '<button class="tool-btn danger" style="width:100%;margin-top:16px;padding:13px" data-act="ask-clear">清空全部卡片</button>'
      : ''}
  `;
}

/* ---------- modals ---------- */
function viewModal() {
  const m = state.modal;
  if (!m) return '';

  if (m.type === 'alert') {
    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>${esc(m.title)}</h3></header>
          <div class="body"><p>${esc(m.text)}</p></div>
          <footer><button class="primary" data-act="close-modal">知道了</button></footer>
        </div>
      </div>`;
  }

  if (m.type === 'confirm-clear') {
    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>清空全部卡片？</h3></header>
          <div class="body"><p>${state.cards.length} 张卡片和生词本都会被删掉，这个操作不能撤销。<br><br>建议先点「导出 CSV」备份一份。</p></div>
          <footer>
            <button data-act="close-modal">取消</button>
            <button class="danger" data-act="do-clear">确认清空</button>
          </footer>
        </div>
      </div>`;
  }

  if (m.type === 'confirm-del') {
    const c = state.cards.find(function (x) { return x.id === m.id; });
    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>删除这张卡片？</h3></header>
          <div class="body"><p>「${esc(c ? c.word : '')}」会被删掉，不能撤销。</p></div>
          <footer>
            <button data-act="close-modal">取消</button>
            <button class="danger" data-act="do-del" data-id="${m.id}">删除</button>
          </footer>
        </div>
      </div>`;
  }

  if (m.type === 'edit' || m.type === 'add') {
    const c = m.type === 'edit'
      ? state.cards.find(function (x) { return x.id === m.id; }) || {}
      : { word: '', phonetic: '', meaning: '', partOfSpeech: '', example: '' };
    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>${m.type === 'edit' ? '编辑卡片' : '添加卡片'}</h3></header>
          <div class="body">
            <div class="field"><label>单词</label><input id="e-word" value="${esc(c.word)}" placeholder="apple"></div>
            <div class="field"><label>音标</label><input id="e-phon" value="${esc(c.phonetic)}" placeholder="/ˈæpl/"></div>
            <div class="field"><label>释义</label><input id="e-mean" value="${esc(c.meaning)}" placeholder="苹果"></div>
            <div class="field"><label>词性</label><input id="e-pos" value="${esc(c.partOfSpeech)}" placeholder="n."></div>
            <div class="field"><label>例句</label><textarea id="e-eg" placeholder="I ate an apple.">${esc(c.example)}</textarea></div>
          </div>
          <footer>
            <button data-act="close-modal">取消</button>
            <button class="primary" data-act="${m.type === 'edit' ? 'do-edit' : 'do-add'}" data-id="${m.id || ''}">保存</button>
          </footer>
        </div>
      </div>`;
  }

  if (m.type === 'favorites') {
    const favs = favoriteCards();
    const body = favs.length === 0
      ? '<p>生词本还是空的。翻卡的时候点「收藏」，单词就会进到这里。</p>'
      : favs.map(function (c) {
          return `
            <div class="fav-row">
              <div style="flex:1;min-width:0">
                <div class="w">${esc(c.word)}</div>
                <div class="m">${c.meaning ? esc(c.meaning) : '（无释义）'}</div>
              </div>
              <button class="icon-btn del" data-act="unfav" data-word="${esc(c.word)}" title="移出生词本">🗑</button>
            </div>`;
        }).join('');
    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>生词本</h3><button class="icon-btn" data-act="close-modal">✕</button></header>
          <div class="body">${body}</div>
          <footer style="flex-direction:column;gap:8px">
            <div style="display:flex;gap:10px;width:100%">
              <button class="primary" data-act="study-all">学习全部单词</button>
              <button class="primary" data-act="study-fav">学习收藏单词</button>
            </div>
            ${favs.length > 0
              ? '<button style="width:100%" data-act="export-fav">⬇ 导出生词本（' + favs.length + ' 个）</button>'
              : ''}
            <button style="width:100%" data-act="import-fav">⬆ 导入生词本</button>
          </footer>
        </div>
      </div>`;
  }

  if (m.type === 'voice') {
    // Names iOS/macOS commonly ships as male voices. Only a hint — the
    // platform exposes no gender field, so the 试听 button is the real test.
    const MALE = ['aaron','alex','arthur','daniel','fred','gordon','lee','oliver',
                  'reed','rishi','rocko','tom','eddy','grandpa','li-mu','李木',
                  'liang','yunyang','kangkang','hanhan'];
    const isMale = function (n) {
      const s = String(n).toLowerCase();
      return MALE.some(function (m2) { return s.indexOf(m2) !== -1; });
    };

    const group = function (title, prefix, key, sample, lang) {
      const list = voicesByLang(prefix);
      if (!list.length) {
        return `<div class="vgroup"><h4>${title}</h4>
                  <p style="font-size:12.5px;color:var(--text-dim);margin:0">
                    这台设备没有${title}</p></div>`;
      }
      const cur = localStorage.getItem(key) || (pickVoice(lang) || {}).name || '';
      const rows = list.map(function (v) {
        return `
          <div class="vrow ${v.name === cur ? 'on' : ''}">
            <button class="vpick" data-act="voice-pick" data-key="${key}" data-name="${esc(v.name)}">
              <span class="vname">${v.name === cur ? '● ' : '○ '}${esc(v.name)}${isMale(v.name) ? ' <span class="male">男声?</span>' : ''}</span>
              <span class="vlang">${esc(v.lang)}</span>
            </button>
            <button class="icon-btn" data-act="voice-try" data-name="${esc(v.name)}"
                    data-text="${esc(sample)}" data-lang="${lang}" title="试听">▶</button>
          </div>`;
      }).join('');
      return `<div class="vgroup"><h4>${title}（${list.length} 个）</h4>${rows}</div>`;
    };

    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>🗣 换朗读声音</h3><button class="icon-btn" data-act="close-modal">✕</button></header>
          <div class="body">
            <p style="font-size:12.5px;margin-bottom:12px">
              点 <b>▶</b> 试听，点名字选中。标「男声?」只是按常见名字猜的，<b>以试听为准</b>。
            </p>
            ${group('英文声音', 'en', VOICE_EN_KEY, 'apple, this is a test', 'en-US')}
            ${group('中文声音', 'zh', VOICE_ZH_KEY, '苹果，这是一段试听', 'zh-CN')}
          </div>
          <footer>
            <button data-act="voice-reset">恢复默认</button>
            <button class="primary" data-act="close-modal">完成</button>
          </footer>
        </div>
      </div>`;
  }

  if (m.type === 'sync') {
    const isFile = location.protocol === 'file:';
    const connected = !!state.syncToken;

    const msg = state.syncMsg
      ? `<div class="notice ${state.syncStatus === 'error' ? 'err' : 'info'}"
              style="margin-bottom:12px"><span>${state.syncStatus === 'error' ? '⚠️' : '✓'}</span>
              <span>${esc(state.syncMsg)}</span></div>`
      : '';

    const body = connected ? `
      ${msg}
      <p style="margin-bottom:10px">
        已连接到你的私密 Gist。<br>
        状态：<b style="color:#fff">${syncTimeLabel()}</b><br>
        本地：<b style="color:#fff">${state.cards.length}</b> 张卡片、<b style="color:#fff">${state.favorites.length}</b> 个生词
      </p>
      <p style="font-size:12.5px">
        改动会在几秒后自动上传，打开页面时自动拉取。两边内容不一样时<b>合并</b>，谁都不会丢。
      </p>
      <div class="danger-zone">
        <button data-act="sync-up">⬆ 强制上传<br><span style="opacity:.7">本地覆盖云端</span></button>
        <button data-act="sync-down">⬇ 强制下载<br><span style="opacity:.7">云端覆盖本地</span></button>
      </div>
      <div style="margin-top:12px">
        <button class="tool-btn" style="width:100%" data-act="sync-off">断开同步（不会删数据）</button>
      </div>
    ` : `
      ${msg}
      ${isFile ? `<div class="notice err" style="margin-bottom:12px"><span>⚠️</span>
        <span>你现在是用本地文件打开的，同步多半会被浏览器拦住。请改用网址打开：<br>
        <code>pyyannie.github.io/flash-card/</code></span></div>` : ''}
      <p>把手机和电脑的单词库连起来。数据存在<b>你自己的私密 Gist</b> 里，只有你能看到。</p>
      <div class="field">
        <label>GitHub 令牌（token）</label>
        <input id="sync-token" type="password" placeholder="ghp_ 或 github_pat_ 开头" autocomplete="off">
      </div>
      <div class="token-help">
        <b>怎么拿这串令牌</b>
        <ol>
          <li>打开 <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener">github.com/settings/tokens/new</a></li>
          <li><b>Note</b> 随便填，例如 <code>flash-card-sync</code></li>
          <li><b>Expiration</b> 建议选 <b>No expiration</b>，否则到期后同步会失效</li>
          <li>往下滚，<b>只勾 <code>gist</code> 这一个</b>，别的都不要勾</li>
          <li>点 Generate token，复制那串 <code>ghp_</code> 开头的字符，粘到上面</li>
        </ol>
        令牌只存在这台设备的浏览器里，不会上传、不在网页代码里。<br>
        另一台设备填<b>同一串令牌</b>就能对上，不用记别的编号。
      </div>
    `;

    return `
      <div class="mask" data-act="close-modal">
        <div class="modal" data-stop>
          <header><h3>☁️ 云端同步</h3><button class="icon-btn" data-act="close-modal">✕</button></header>
          <div class="body">${body}</div>
          <footer>
            <button data-act="close-modal">关闭</button>
            ${connected
              ? '<button class="primary" data-act="sync-run">立即同步</button>'
              : '<button class="primary" data-act="sync-connect">连接</button>'}
          </footer>
        </div>
      </div>`;
  }

  return '';
}

/* =========================================================
   Render
   ========================================================= */
function render() {
  const app = document.getElementById('app');
  let html = '';
  if (state.view === 'home') html = viewHome();
  else if (state.view === 'input') html = viewInput();
  else if (state.view === 'flashcard') html = viewFlashcard();
  else if (state.view === 'manage') html = viewManage();
  app.innerHTML = html + viewModal();

  // Restore textarea content + caret behaviour on the input page
  const ta = document.getElementById('word-input');
  if (ta) {
    ta.addEventListener('input', function () { state.inputText = ta.value; });
  }
  const focusField = document.getElementById('e-word');
  if (focusField) focusField.focus();
}

/* =========================================================
   Event delegation
   ========================================================= */
document.addEventListener('click', function (ev) {
  // Unlock the speech engine while we are still inside the gesture, so the
  // timer-driven calls during autoplay are allowed to make sound on iOS.
  primeSpeech();

  const stopper = ev.target.closest('[data-stop]');
  const el = ev.target.closest('[data-act]');

  // Click inside a modal box but not on an action: swallow it so the
  // backdrop handler does not close the modal.
  if (!el) return;
  if (el.classList.contains('mask') && stopper) return;

  const act = el.dataset.act;
  const id = el.dataset.id;
  const word = el.dataset.word;

  switch (act) {
    case 'home': goHome(); break;
    case 'input': setState({ view: 'input', error: '', info: '', modal: null }); break;
    case 'manage': setState({ view: 'manage', error: '', info: '', modal: null }); break;
    case 'study-all': enterFlashcards('all'); break;
    case 'study-fav': enterFlashcards('fav'); break;

    case 'flip': setState({ flipped: !state.flipped }); if (state.autoPlay) scheduleAuto(); break;
    case 'prev': stepCard(-1); break;
    case 'next': stepCard(1); break;

    case 'auto-toggle':
      if (state.autoPlay) pauseAuto(); else startAuto();
      break;
    case 'auto-stop': stopAuto(); break;
    case 'say-off':
    case 'say-en':
    case 'say-both': {
      const mode = act.slice(4);
      localStorage.setItem('flashcard_speak_mode', mode);
      if (mode === 'off') { const s = tts(); if (s) s.cancel(); }
      setState({ speakMode: mode });
      break;
    }
    case 'speed-slow':
    case 'speed-mid':
    case 'speed-fast': {
      const sp = act.slice(6);
      localStorage.setItem('flashcard_speed', sp);
      setState({ speed: sp });
      if (state.autoPlay) scheduleAuto();   // apply the new pace immediately
      break;
    }
    case 'fav': toggleFav(state.deck[state.index].word); break;
    case 'speak':
      // Manual button reads whichever side is showing.
      if (state.flipped) speakMeaning(state.deck[state.index]);
      else speak(state.deck[state.index].word, 'en-US');
      break;
    case 'speak-one': speak(word, 'en-US'); break;
    case 'fav-one': toggleFav(word); break;
    case 'unfav': toggleFav(word); break;

    case 'submit': handleTextSubmit(); break;
    case 'file': handleFileImport('cards'); break;
    case 'import-fav': handleFileImport('favorites'); break;
    case 'paste': handlePaste(); break;
    case 'clear-text': setState({ inputText: '', error: '', info: '' }); break;
    case 'clear-msg': setState({ error: '', info: '' }); break;
    case 'export': exportCsv('all'); break;
    case 'export-fav': exportCsv('fav'); break;

    case 'sort-order':
    case 'sort-az': {
      const mode = act === 'sort-az' ? 'az' : 'order';
      localStorage.setItem(SORT_KEY, mode);
      setState({ manageSort: mode });
      break;
    }

    case 'add-one': setState({ modal: { type: 'add' } }); break;
    case 'do-add': addOneCard(); break;
    case 'edit': setState({ modal: { type: 'edit', id: id } }); break;
    case 'do-edit': saveEdit(id); break;
    case 'ask-del': setState({ modal: { type: 'confirm-del', id: id } }); break;
    case 'do-del': deleteCard(id); break;
    case 'ask-clear': setState({ modal: { type: 'confirm-clear' } }); break;
    case 'do-clear': clearAll(); break;
    case 'fav-modal': setState({ modal: { type: 'favorites' } }); break;

    case 'sync-open': setState({ modal: { type: 'sync' }, syncMsg: state.syncMsg }); break;

    case 'voice-open': setState({ modal: { type: 'voice' } }); break;
    case 'voice-pick': {
      localStorage.setItem(el.dataset.key, el.dataset.name);
      render();
      break;
    }
    case 'voice-try': {
      // Speak with this specific voice without changing the saved choice
      const s = tts();
      if (s) {
        const v = allVoices().find(function (x) { return x.name === el.dataset.name; });
        if (s.speaking || s.pending) s.cancel();
        setTimeout(function () {
          const u = new SpeechSynthesisUtterance(el.dataset.text);
          u.lang = el.dataset.lang;
          if (v) u.voice = v;
          u.rate = el.dataset.lang === 'zh-CN' ? 1 : 0.9;
          u.volume = 1;
          s.speak(u);
        }, 60);
      }
      break;
    }
    case 'voice-reset':
      localStorage.removeItem(VOICE_EN_KEY);
      localStorage.removeItem(VOICE_ZH_KEY);
      render();
      break;
    case 'sync-connect': {
      const el = document.getElementById('sync-token');
      connectSync(el ? el.value : '');
      break;
    }
    case 'sync-run':  syncNow('merge'); break;
    case 'sync-up':   syncNow('up'); break;
    case 'sync-down': syncNow('down'); break;
    case 'sync-off':  disconnectSync(); break;
    case 'close-modal': setState({ modal: null }); break;
  }
});

document.getElementById('file-picker').addEventListener('change', onFileChosen);

// iOS populates the voice list asynchronously; re-render once it arrives so
// the warning above reflects reality rather than the empty first reading.
if (tts() && tts().addEventListener) {
  tts().addEventListener('voiceschanged', function () {
    if (state.view === 'flashcard' && !state.modal) render();
  });
}

/* One-off cleanup on load: drop favourites whose card no longer exists.
   Cards deleted before this cleanup existed left the badge counting words
   that cannot be shown. */
(function pruneFavorites() {
  const words = {};
  state.cards.forEach(function (c) { words[c.word.toLowerCase()] = true; });
  const kept = state.favorites.filter(function (w) { return words[w.toLowerCase()]; });
  if (kept.length !== state.favorites.length) {
    state.favorites = kept;
    saveFavorites(kept);
  }
})();

// Keyboard shortcuts, flashcard view only
document.addEventListener('keydown', function (ev) {
  if (state.view !== 'flashcard' || state.modal) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  if (ev.code === 'Space') { ev.preventDefault(); setState({ flipped: !state.flipped }); if (state.autoPlay) scheduleAuto(); }
  else if (ev.key === 'ArrowLeft') { stepCard(-1); }
  else if (ev.key === 'ArrowRight') { stepCard(1); }
  else if (ev.key === 's' || ev.key === 'S') {
    if (state.flipped) speakMeaning(state.deck[state.index]);
    else speak(state.deck[state.index].word, 'en-US');
  }
  else if (ev.key === 'f' || ev.key === 'F') { toggleFav(state.deck[state.index].word); }
  else if (ev.key === 'p' || ev.key === 'P') { if (state.autoPlay) pauseAuto(); else startAuto(); }
});

render();

// Pull from the cloud once on load, so a device edited elsewhere catches up
// before you start adding to it.
if (state.syncToken) syncNow('merge');
</script>
</body>
</html>
